name: fewcoco-web

services:
  web:
    image: ${IMAGE:?IMAGE not set - run deploy.sh}
    container_name: fewcoco-web
    ports:
      - "${BIND_IP:?BIND_IP not set}:${HOST_PORT:?HOST_PORT not set}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)throw Error(r.status)})"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
